numshares: 2
inline_modules:
  XOR:
    map_to: XOR2
  XNOR:
    map_to: XNOR2
  AND:
    map_to: AND2
  NAND:
    map_to: NAND2
  OR:
    map_to: OR2
  NOR:
    map_to: NOR2
  NOT:
    map_to: NOT

single_rail_output_suffix: _SR

# Port naming of the duality gadgets (--duality)
# A dual-rail port <name> is split into <name><layer0>, <name><duality0> and <name><duality1>
duality:
  port_suffixes:
    layer0: _layer0
    duality0: _duality0
    duality1: _duality1
  merge_module: NOR2
  merge_critical_path: 1

modules:
  XOR2:
    type: linear
    inputs:
      - a
      - b
    outputs:
      - z
    cost:
      single_rail: 3192 # 3.192
      dual_rail: 5320 # 5.320
    critical_path:
      single_rail: 2
      dual_rail: 4
    verilog_output:
      single_rail_module: linear_CCHPC1_1_generic_SRtSR
      dual_rail_module: linear_CCHPC1_1_generic_DRtDR
      duality_dual_rail_module: linear_CCHPC1_1_generic_DRtDR_duality
      config_bits:
        - name: CONF
          value: 1'b0
  XNOR2:
    type: linear
    inputs:
      - a
      - b
    outputs:
      - z
    cost:
      single_rail: 3192 # 3.192
      dual_rail: 5320 # 5.320
    critical_path:
      single_rail: 2
      dual_rail: 4
    verilog_output:
      single_rail_module: linear_CCHPC1_1_generic_SRtSR
      dual_rail_module: linear_CCHPC1_1_generic_DRtDR
      duality_dual_rail_module: linear_CCHPC1_1_generic_DRtDR_duality
      config_bits:
        - name: CONF
          value: 1'b1
  AND2:
    type: non-linear
    inputs:
      - a
      - b
    outputs:
      - z
    clock_wire: clk
    precharge_wire: prch
    duality_precharge_wires:
      - prch0
      - prch1
    cost:
      single_rail: 34048 # 34.048
      dual_rail: 66766 # 66.766
    critical_path:
      single_rail: 4
      dual_rail: 4
    verilog_output:
      single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR
      dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR
      duality_single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR_duality
      duality_dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR_duality
      config_bits:
        - name: CONF
          value: 2'h0
      random_bits:
        single_rail_name: r_SR
        dual_rail_name: r_DR
        duality_dual_rail_names:
          - r_duality0
          - r_duality1
        count: 1
  NAND2:
    type: non-linear
    inputs:
      - a
      - b
    outputs:
      - z
    clock_wire: clk
    precharge_wire: prch
    duality_precharge_wires:
      - prch0
      - prch1
    cost:
      single_rail: 34048 # 34.048
      dual_rail: 66766 # 66.766
    critical_path:
      single_rail: 4
      dual_rail: 4
    verilog_output:
      single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR
      dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR
      duality_single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR_duality
      duality_dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR_duality
      config_bits:
        - name: CONF
          value: 2'h1
      random_bits:
        single_rail_name: r_SR
        dual_rail_name: r_DR
        duality_dual_rail_names:
          - r_duality0
          - r_duality1
        count: 1
  OR2:
    type: non-linear
    inputs:
      - a
      - b
    outputs:
      - z
    clock_wire: clk
    precharge_wire: prch
    duality_precharge_wires:
      - prch0
      - prch1
    cost:
      single_rail: 34048 # 34.048
      dual_rail: 66766 # 66.766
    critical_path:
      single_rail: 4
      dual_rail: 4
    verilog_output:
      single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR
      dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR
      duality_single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR_duality
      duality_dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR_duality
      config_bits:
        - name: CONF
          value: 2'h3
      random_bits:
        single_rail_name: r_SR
        dual_rail_name: r_DR
        duality_dual_rail_names:
          - r_duality0
          - r_duality1
        count: 1
  NOR2:
    type: non-linear
    inputs:
      - a
      - b
    outputs:
      - z
    clock_wire: clk
    precharge_wire: prch
    duality_precharge_wires:
      - prch0
      - prch1
    cost:
      single_rail: 34048 # 34.048
      dual_rail: 66766 # 66.766
    critical_path:
      single_rail: 4
      dual_rail: 4
    verilog_output:
      single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR
      dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR
      duality_single_rail_module: nonlinear_CCHPC1_1_generic_DRtSR_duality
      duality_dual_rail_module: nonlinear_CCHPC1_1_generic_DRtDR_duality
      config_bits:
        - name: CONF
          value: 2'h2
      random_bits:
        single_rail_name: r_SR
        dual_rail_name: r_DR
        duality_dual_rail_names:
          - r_duality0
          - r_duality1
        count: 1
  NOT:
    type: inversion
    inputs:
      - a
    outputs:
      - z
    cost:
      single_rail: 532 # 0.532
      dual_rail: 0
    critical_path:
      single_rail: 1
      dual_rail: 0
    verilog_output:
      single_rail_module: not_CCHPC1_1_generic_SRtSR
      dual_rail_module: not_CCHPC1_1_generic_DRtDR

register:
  input: a
  output: z
  clock_wire: clk
  precharge_wire: prch
  duality_precharge_wires:
    - prch0
    - prch1
  cost:
    single_rail: 4522 # 4.522
    dual_rail: 15694 # 15.694
  verilog_output:
    single_rail_module: reg_SRtSR_generic
    dual_rail_module: reg_SRtDR_generic
    duality_dual_rail_module: reg_SRtDR_generic_duality
